name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

# Cancel in-progress runs when a new commit is pushed to the same ref.
# Keyed by workflow + ref so pushes to different branches don't cancel each
# other; only superseded runs on the same branch/PR are cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: "apps/api/uv.lock"

      - name: Lint (ruff check + format)
        run: |
          cd apps/api
          uv run ruff check .
          uv run ruff format --check .

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck -w @protin/mobile

  lint-mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint -w @protin/mobile

  web-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Typecheck and build web
        run: npm run build -w @protin/web

  test-mobile:
    runs-on: ubuntu-latest
    needs: lint-mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test:ci -w @protin/mobile

  test:
    # API tests use SQLite in-memory — no external services required.
    runs-on: ubuntu-latest
    needs: lint
    env:
      SECRET_KEY: ci-test-secret-key-minimum-32-characters

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: "apps/api/uv.lock"

      - name: Run tests
        run: cd apps/api && uv run pytest

  postgres-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: protin_test
          POSTGRES_USER: protin
          POSTGRES_PASSWORD: protin_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U protin -d protin_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENV: local
      SECRET_KEY: ci-test-secret-key-minimum-32-characters
      POSTGRES_URL: postgresql://protin:protin_test_password@localhost:5432/protin_test
      POSTGRES_TEST_URL: postgresql+asyncpg://protin:protin_test_password@localhost:5432/protin_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: "apps/api/uv.lock"
      - name: Apply all Alembic migrations
        run: cd apps/api && uv run alembic upgrade head
      - name: Verify one migration head
        run: test "$(cd apps/api && uv run alembic heads | wc -l | tr -d ' ')" = "1"
      - name: Run PostgreSQL concurrency tests
        run: cd apps/api && uv run pytest -q tests/integration

  docker-build:
    runs-on: ubuntu-latest
    needs: [test, postgres-integration, typecheck, test-mobile, web-quality]
    steps:
      - uses: actions/checkout@v4

      # Build context is the repo ROOT, not apps/api. apps/api/Dockerfile
      # COPYs repo-root-relative paths (apps/api/pyproject.toml, ...) to match
      # how fly.toml builds the image, and the root .dockerignore is written
      # against the same context. Passing `apps/api` as the context fails at
      # the first COPY.
      - name: Build API Docker image
        run: docker build -f apps/api/Dockerfile .

      - name: Verify staging exposure
        run: bash infra/scripts/check-staging-compose.sh
