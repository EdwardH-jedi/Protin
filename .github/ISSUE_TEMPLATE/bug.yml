name: Bug
description: Report reproducible incorrect behaviour and its user impact.
labels: []
assignees: []
body:
  - type: textarea
    id: observed-behaviour
    attributes:
      label: Observed behaviour
      description: What happened?
    validations:
      required: true

  - type: textarea
    id: expected-behaviour
    attributes:
      label: Expected behaviour
      description: What should have happened instead?
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Provide the smallest reliable sequence that reproduces the problem.
      placeholder: "1. Open ...\n2. Select ...\n3. Observe ..."
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include the app version, device or browser, OS, API environment, and relevant configuration.
    validations:
      required: true

  - type: dropdown
    id: severity
    attributes:
      label: Severity and user impact
      description: Choose the highest level that accurately describes the impact.
      options:
        - Critical - security, data loss, or service unavailable
        - High - core user flow is blocked with no practical workaround
        - Medium - behaviour is incorrect but a workaround exists
        - Low - limited impact or cosmetic defect
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Logs or screenshots
      description: Add sanitized evidence when available. Do not include secrets or personal data.
    validations:
      required: false

  - type: input
    id: suspected-area
    attributes:
      label: Suspected area
      description: Optional module, screen, endpoint, or recent change that may be related.
    validations:
      required: false
