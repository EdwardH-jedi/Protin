[alembic]
# Path to migration scripts, relative to this file
script_location = alembic

# Prepend sys.path so app.* imports resolve without installation
prepend_sys_path = .

# Use OS-native path separator for version locations
version_path_separator = os

# Placeholder — env.py reads the real URL from app.core.config
sqlalchemy.url = driver://user:pass@localhost/dbname

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
