<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="color-scheme" content="light" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="robots" content="index, follow" />

    <title>Protin — Find your next workout partner</title>
    <meta
      name="description"
      content="Protin helps you find workout partners, sports partners, group events, and real-life fitness communities — gym, golf, running, badminton, tennis, and more."
    />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Protin" />
    <meta property="og:title" content="Protin — Find your next workout partner" />
    <meta
      property="og:description"
      content="Protin connects people through fitness, sports, and real-life activity — gym sessions, golf rounds, running crews, and group events."
    />
    <!-- TODO(launch): set og:url + og:image once the production domain and
         hero share image are finalised. og:image must be at least 1200x630
         and use absolute https URLs. -->

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Protin — Find your next workout partner" />
    <meta
      name="twitter:description"
      content="Workout partner matching, sports rooms, group events, and a real-life fitness community."
    />
    <!-- TODO(launch): set twitter:image once the share image is finalised. -->

    <style>
      html,
      body {
        height: 100%;
        margin: 0;
        background: #ffffff;
      }
      #root {
        min-height: 100%;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <p style="padding:24px;font-family:system-ui,sans-serif;text-align:center">
        Protin's marketing site needs JavaScript enabled. Please enable
        JavaScript or contact <a href="mailto:hello@protin.app">hello@protin.app</a>.
      </p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
