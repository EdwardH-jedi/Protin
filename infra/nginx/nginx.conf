# =============================================================================
# Protin — nginx reverse proxy configuration
#
# Layout:
#   • This file always serves HTTP on port 80:
#       - ACME http-01 challenge location (/.well-known/acme-challenge/)
#       - Plain-HTTP proxy to the API (fallback for staging / LAN)
#   • HTTPS (port 443) is supplied by a drop-in file in /etc/nginx/conf.d/.
#     It is intentionally NOT inline here so nginx can start in environments
#     where TLS certs are not yet provisioned (e.g. staging pre-certbot).
#
# Production (HTTPS enabled):
#   Mount the real conf.d with the HTTPS block:
#     - ./infra/nginx/conf.d:/etc/nginx/conf.d:ro
#     - /etc/letsencrypt:/etc/letsencrypt:ro
#     - ./infra/nginx/certbot-webroot:/var/www/certbot:ro
#   Provision certs with:
#     certbot certonly --webroot -w /var/www/certbot -d <domain> \
#         --cert-name protin
#
# Staging (HTTP only):
#   Mount the empty staging conf.d so the nginx image's default.conf
#   does NOT load, and no HTTPS block is included:
#     - ./infra/nginx/conf.d.staging:/etc/nginx/conf.d:ro
#   This is the default in docker-compose.staging.yml.
# =============================================================================

events {
    worker_connections 1024;
}

http {
    # ── Logging ──────────────────────────────────────────────────────────────
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent"';
    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    # ── Compression ──────────────────────────────────────────────────────────
    gzip on;
    gzip_types application/json text/plain;
    gzip_min_length 1024;

    # ── Upstream ─────────────────────────────────────────────────────────────
    upstream api {
        server api:8000;
        keepalive 32;
    }

    # ── Shared SSL session cache (used by the HTTPS drop-in when mounted) ───
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # ── HTTP server (port 80) ────────────────────────────────────────────────
    # Always active. Serves:
    #   1. ACME http-01 challenge for Let's Encrypt renewals.
    #   2. Plain-HTTP API proxy (staging / LAN fallback).
    #
    # When HTTPS is in use in production, this block still answers plain
    # HTTP so that certbot renewals succeed. If you want to force HTTPS,
    # replace the "location /" below with:
    #     location / { return 301 https://$host$request_uri; }
    server {
        listen 80;
        server_name _;

        # ACME http-01 challenge (Let's Encrypt)
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
            default_type "text/plain";
            access_log off;
        }

        # Health check — accessible for monitoring without TLS
        location /health {
            proxy_pass         http://api/health;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
            access_log         off;
        }

        location / {
            proxy_pass         http://api;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto http;
            proxy_set_header   Connection        "";
            proxy_read_timeout  60s;

            # WebSocket support (chat endpoint)
            proxy_set_header   Upgrade    $http_upgrade;
            proxy_set_header   Connection "upgrade";
        }
    }

    # ── HTTPS drop-in ────────────────────────────────────────────────────────
    # Loads infra/nginx/conf.d/https.conf when mounted. Staging mounts an
    # empty directory here, keeping nginx HTTP-only.
    include /etc/nginx/conf.d/*.conf;
}
