# =============================================================================
# Protin — nginx reverse proxy configuration
#
# Default mode: HTTP-only on port 80 (suitable for LAN staging).
# nginx starts without any SSL certificates in this mode.
#
# To enable HTTPS:
#   1. Generate a self-signed cert (or place a real one):
#        bash infra/scripts/gen-cert.sh
#   2. Uncomment the HTTPS server block below.
#   3. Replace the HTTP proxy block with the HTTP→HTTPS redirect block.
#   4. Restart nginx: docker compose restart nginx
# =============================================================================

events {
    worker_connections 1024;
}

http {
    # ── Logging ──────────────────────────────────────────────────────────────
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent"';
    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    # ── Compression ──────────────────────────────────────────────────────────
    gzip on;
    gzip_types application/json text/plain;
    gzip_min_length 1024;

    # ── Upstream ─────────────────────────────────────────────────────────────
    upstream api {
        server api:8000;
        keepalive 32;
    }

    # ── HTTP server (default: proxy API directly) ────────────────────────────
    #
    # HTTPS upgrade: replace this block with the redirect block below, then
    # uncomment the HTTPS server block.
    server {
        listen 80;
        server_name _;

        # Health check — accessible for monitoring without TLS
        location /health {
            proxy_pass         http://api/health;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
            access_log         off;
        }

        location / {
            proxy_pass         http://api;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto http;
            proxy_set_header   Connection        "";
            proxy_read_timeout  60s;

            # WebSocket support (chat endpoint)
            proxy_set_header   Upgrade    $http_upgrade;
            proxy_set_header   Connection "upgrade";
        }
    }

    # ── HTTP→HTTPS redirect (enable when certs are ready) ────────────────────
    # Swap this block in place of the HTTP proxy block above, then uncomment
    # the HTTPS server block below.
    #
    # server {
    #     listen 80;
    #     server_name _;
    #     location / { return 301 https://$host$request_uri; }
    #     location /health {
    #         proxy_pass http://api/health;
    #         proxy_http_version 1.1;
    #         proxy_set_header Host $host;
    #         access_log off;
    #     }
    # }

    # ── HTTPS server (uncomment when certs are ready) ─────────────────────────
    # Requires: infra/nginx/certs/protin.crt + infra/nginx/certs/protin.key
    # Generate: bash infra/scripts/gen-cert.sh
    #
    # server {
    #     listen 443 ssl;
    #     server_name _;
    #
    #     ssl_certificate     /etc/nginx/certs/protin.crt;
    #     ssl_certificate_key /etc/nginx/certs/protin.key;
    #     ssl_protocols       TLSv1.2 TLSv1.3;
    #     ssl_ciphers         HIGH:!aNULL:!MD5;
    #
    #     location /health {
    #         proxy_pass         http://api/health;
    #         proxy_http_version 1.1;
    #         proxy_set_header   Host $host;
    #         access_log         off;
    #     }
    #
    #     location / {
    #         proxy_pass         http://api;
    #         proxy_http_version 1.1;
    #         proxy_set_header   Host              $host;
    #         proxy_set_header   X-Real-IP         $remote_addr;
    #         proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    #         proxy_set_header   X-Forwarded-Proto https;
    #         proxy_set_header   Connection        "";
    #         proxy_read_timeout  60s;
    #         proxy_set_header   Upgrade    $http_upgrade;
    #         proxy_set_header   Connection "upgrade";
    #     }
    # }
}
