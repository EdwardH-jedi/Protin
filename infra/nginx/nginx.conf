# =============================================================================
# Protin — nginx reverse proxy configuration
#
# HTTP-only by default (suitable for LAN staging on the RX6600).
# To enable HTTPS:
#   1. Place your cert at infra/nginx/certs/protin.crt
#   2. Place your key at infra/nginx/certs/protin.key
#   3. Uncomment the HTTPS server block below and restart nginx.
#
# Self-signed cert (staging only):
#   mkdir -p infra/nginx/certs
#   openssl req -x509 -newkey rsa:4096 -keyout infra/nginx/certs/protin.key \
#     -out infra/nginx/certs/protin.crt -days 365 -nodes \
#     -subj "/CN=protin-staging"
# =============================================================================

events {
    worker_connections 1024;
}

http {
    # ── Logging ──────────────────────────────────────────────────────────────
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent"';
    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    # ── Compression ──────────────────────────────────────────────────────────
    gzip on;
    gzip_types application/json text/plain;
    gzip_min_length 1024;

    # ── Upstream ─────────────────────────────────────────────────────────────
    upstream api {
        server api:8000;
        keepalive 32;
    }

    # ── HTTP server ───────────────────────────────────────────────────────────
    server {
        listen 80;
        server_name _;

        # API proxy
        location / {
            proxy_pass         http://api;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Connection        "";

            # Generous timeout for long-running requests (calendar sync etc.)
            proxy_read_timeout  60s;
            proxy_send_timeout  60s;
            proxy_connect_timeout 10s;

            # Buffer settings
            proxy_buffering    on;
            proxy_buffer_size  4k;
            proxy_buffers      8 4k;
        }

        # Health check — accessible without auth for monitoring
        location /health {
            proxy_pass         http://api/health;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
            access_log         off;
        }
    }

    # ── HTTPS server (uncomment to enable) ───────────────────────────────────
    # server {
    #     listen 443 ssl;
    #     server_name _;
    #
    #     ssl_certificate     /etc/nginx/certs/protin.crt;
    #     ssl_certificate_key /etc/nginx/certs/protin.key;
    #     ssl_protocols       TLSv1.2 TLSv1.3;
    #     ssl_ciphers         HIGH:!aNULL:!MD5;
    #
    #     location / {
    #         proxy_pass         http://api;
    #         proxy_http_version 1.1;
    #         proxy_set_header   Host              $host;
    #         proxy_set_header   X-Real-IP         $remote_addr;
    #         proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    #         proxy_set_header   X-Forwarded-Proto https;
    #         proxy_set_header   Connection        "";
    #         proxy_read_timeout  60s;
    #     }
    # }
}
