# =============================================================================
# Protin — HTTPS server block (production drop-in)
#
# Included by nginx.conf's `include /etc/nginx/conf.d/*.conf;`.
# Requires Let's Encrypt certificates at:
#   /etc/letsencrypt/live/protin/fullchain.pem
#   /etc/letsencrypt/live/protin/privkey.pem
#
# Bootstrap (first time, on the host):
#   certbot certonly --webroot -w /var/www/certbot \
#       -d <your.domain> --cert-name protin \
#       --agree-tos -m ops@<your.domain> --no-eff-email
#
# Renewal runs non-interactively (certbot renew); nginx reloads certs on
# `docker compose exec nginx nginx -s reload`.
#
# Staging deployments bypass this file entirely by mounting
# infra/nginx/conf.d.staging (empty) at /etc/nginx/conf.d instead.
# =============================================================================

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/letsencrypt/live/protin/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/protin/privkey.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers off;

    # HSTS — 6 months. Bump to 1 year + preload once stable.
    add_header Strict-Transport-Security "max-age=15768000" always;

    # Health check — no access log
    location /health {
        proxy_pass         http://api/health;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        access_log         off;
    }

    location / {
        proxy_pass         http://api;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_set_header   Connection        "";
        proxy_read_timeout  60s;

        # WebSocket support (chat endpoint)
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
    }
}
