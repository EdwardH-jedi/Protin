# fly.toml app configuration file generated for protin-api on 2026-05-07T19:32:08+10:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'protin-api'
primary_region = 'syd'

[build]
  dockerfile = 'apps/api/Dockerfile'

[processes]
  app = 'uvicorn app.main:app --host 0.0.0.0 --port 8000 --log-level info'
  worker = 'python worker.py'

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '20s'
    method = 'GET'
    path = '/health'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
  processes = ['app']

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
  processes = ['worker']
